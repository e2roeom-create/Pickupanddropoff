<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>บันทึกการรับ-ส่งเอกสาร</title>
<style>
  :root{
    --bg:#f3f0f8; --card:#fff; --ink:#2a2140; --muted:#6f6685;
    --brand:#6b3fa0; --brand-d:#52307d; --line:#ddd6ea; --ok:#1d8a4f; --err:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:17px}
  header{background:var(--brand);color:#fff;padding:18px 16px;text-align:center}
  header h1{margin:0;font-size:1.3rem;font-weight:700}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(60,30,100,.08)}
  label{display:block;font-weight:600;margin-bottom:6px}
  input[type=text],input[type=number]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  input:focus{outline:none;border-color:var(--brand)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:600}
  .btn-primary{background:var(--brand);color:#fff;width:100%;font-size:1.1rem;padding:15px}
  .btn-primary:active{background:var(--brand-d)}
  .btn-primary:disabled{opacity:.6}
  .btn-sec{background:#ece6f6;color:var(--brand-d)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .item{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#faf8fd}
  .item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;color:var(--brand-d)}
  .item-head button{background:#fde8e6;color:var(--err);padding:6px 12px;font-size:.9rem}
  .item .row{margin-top:0}
  .item .field{margin-bottom:0}
  .item small{display:block;color:var(--muted);margin-bottom:4px;font-weight:600}
  .item-head .no{font-size:1.15rem;margin-left:4px}
  .photo-box{margin-top:10px;text-align:center}
  .photo-box img{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line)}
  .sig-wrap{border:1.5px dashed var(--brand);border-radius:10px;background:#fff;touch-action:none}
  canvas#sig{width:100%;height:180px;display:block}
  .hint{color:var(--muted);font-size:.85rem;margin-top:6px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;z-index:50}
  #toast.show{opacity:1}
  #toast.ok{background:var(--ok)} #toast.err{background:var(--err)}
  #pending{display:none;background:#fff4d6;border:1px solid #f0d78a;color:#6b5400;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.92rem}
  /* กล้อง */
  #camModal{display:none;position:fixed;inset:0;background:#000;z-index:40;flex-direction:column}
  #camModal.open{display:flex}
  #camModal video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
  .cam-bar{display:flex;justify-content:space-around;align-items:center;padding:16px;background:#111}
  .shutter{width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid #aaa;padding:0}
  .cam-bar .btn-sec{background:#333;color:#fff}
</style>
</head>
<body>
<header><h1>บันทึกการรับ-ส่งเอกสาร</h1></header>

<main>
  <div id="pending"></div>

  <form id="form" autocomplete="off">
    <div class="card">
      <div class="field">
        <label for="office">กฟฟ.</label>
        <input type="text" id="office" list="officeList" placeholder="เช่น กฟอ.เมืองเพชรบุรี" required>
        <datalist id="officeList"></datalist>
      </div>
    </div>

    <div class="card">
      <label>รายการเอกสาร</label>
      <div id="items"></div>
      <button type="button" class="btn-sec" id="btnAddItem" style="width:100%;margin-top:4px">➕ เพิ่มรายการ</button>    </div>

    <div class="card">
      <label>รูปถ่ายผู้รับ</label>
      <div class="btn-row">
        <button type="button" class="btn-sec" id="btnCam">📷 ถ่ายรูป</button>
        <button type="button" class="btn-sec" id="btnPhotoClear" style="display:none">ลบรูป</button>
      </div>
      <div class="hint">กดปุ่มเพื่อเปิดกล้องโทรศัพท์และถ่ายรูปผู้รับ (ไม่รองรับการอัปโหลดรูป)</div>
      <div class="photo-box"><img id="photoPrev" alt="" style="display:none"></div>
    </div>

    <div class="card">
      <label>ลายเซ็น</label>
      <div class="sig-wrap"><canvas id="sig"></canvas></div>
      <div class="btn-row" style="margin-top:10px">
        <button type="button" class="btn-sec" id="btnSigClear">ล้างลายเซ็น</button>
      </div>
      <div class="hint">ใช้นิ้วหรือปากกาเซ็นในกรอบ</div>
    </div>

    <button type="submit" class="btn-primary" id="btnSubmit">ส่งข้อมูล</button>
  </form>
</main>

<!-- หน้ากล้อง (ถ่ายสดในหน้าเว็บ ไม่มีการเลือกรูปจากเครื่อง) -->
<div id="camModal">
  <video id="camVideo" autoplay playsinline muted></video>
  <div class="cam-bar">
    <button type="button" class="btn-sec" id="camCancel">ยกเลิก</button>
    <button type="button" class="shutter" id="camShot" aria-label="ถ่าย"></button>
    <button type="button" class="btn-sec" id="camFlip">สลับกล้อง</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============ ตั้งค่า ============ */
// วาง URL ของ Google Apps Script (Web app) ที่ Deploy แล้วตรงนี้
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvi9q89ly8BTtE3OEbdpCQsjEgPvul0IM53SV3yoSrO6HwJlbeExzooMdpg2CGqVuN/exec";
/* ================================= */

const $ = id => document.getElementById(id);
const toast = (msg, type="") => {
  const t = $("toast"); t.textContent = msg; t.className = "show " + type;
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.className = "", 3200);
};

/* ---------- จำ กฟฟ. ที่เคยกรอก ---------- */
const LS_OFFICES = "docrec_offices", LS_QUEUE = "docrec_queue", LS_LAST = "docrec_last";
function loadOffices(){
  try{
    const arr = JSON.parse(localStorage.getItem(LS_OFFICES) || "[]");
    $("officeList").innerHTML = arr.map(o => `<option value="${o.replace(/"/g,"&quot;")}">`).join("");
  }catch(e){}
}
function rememberOffice(o){
  try{
    const arr = JSON.parse(localStorage.getItem(LS_OFFICES) || "[]");
    if(!arr.includes(o)){ arr.unshift(o); localStorage.setItem(LS_OFFICES, JSON.stringify(arr.slice(0,30))); }
    localStorage.setItem(LS_LAST, o);
  }catch(e){}
  loadOffices();
}
loadOffices();
try{ $("office").value = localStorage.getItem(LS_LAST) || ""; }catch(e){}

/* ---------- รายการเอกสาร (เพิ่ม/ลบได้) ---------- */
// ลำดับรายการรันอัตโนมัติ ต่อเนื่องจากครั้งก่อน (เก็บในเครื่อง)
const LS_NEXT = "docrec_next";
const getBase = () => { try{ return parseInt(localStorage.getItem(LS_NEXT),10) || 1; }catch(e){ return 1; } };
const setBase = n => { try{ localStorage.setItem(LS_NEXT, String(n)); }catch(e){} };
function renumber(){
  const base = getBase();
  [...$("items").querySelectorAll(".item")].forEach((el,i) => { el.querySelector(".i-no").textContent = base + i; });
}
function addItem(){
  const box = document.createElement("div");
  box.className = "item";
  box.innerHTML = `
    <div class="item-head"><span>รายการที่ <span class="i-no no"></span></span>
      <button type="button" class="i-del">ลบ</button></div>
    <div class="row">
      <div class="field"><small>เลขที่</small><input type="text" class="i-doc" required></div>
      <div class="field"><small>เล่มที่</small><input type="text" class="i-vol" required></div>
    </div>`;
  box.querySelector(".i-del").onclick = () => {
    if($("items").children.length <= 1){ toast("ต้องมีอย่างน้อย 1 รายการ","err"); return; }
    box.remove(); renumber();
  };
  $("items").appendChild(box);
  renumber();
  box.querySelector(".i-doc").focus({preventScroll:false});
}
function resetItems(){ $("items").innerHTML = ""; addItem(); }
$("btnAddItem").onclick = addItem;
resetItems();
function readItems(){
  return [...$("items").querySelectorAll(".item")].map(el => ({
    item: el.querySelector(".i-no").textContent,
    docNo: el.querySelector(".i-doc").value.trim(),
    volume: el.querySelector(".i-vol").value.trim()
  }));
}

/* ---------- ถ่ายรูป (เปิดกล้องสดในหน้าเว็บ ไม่มีตัวเลือกอัปโหลดรูป) ---------- */
let photoData = "", stream = null, facing = "environment";

function camError(err){
  const ua = navigator.userAgent || "";
  if(/Line|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua)){
    return "เปิดลิงก์ในแอปนี้ไม่ได้ กรุณากดเมนู ⋮ แล้วเลือก \"เปิดด้วย Chrome/Safari\"";
  }
  if(!window.isSecureContext) return "ต้องเปิดลิงก์แบบ https:// เท่านั้น";
  switch(err && err.name){
    case "NotAllowedError": case "SecurityError":
      return "ยังไม่ได้อนุญาตกล้อง กรุณากดอนุญาต (หรือไปที่ตั้งค่าเว็บไซต์ในเบราว์เซอร์ > กล้อง > อนุญาต) แล้วลองใหม่";
    case "NotFoundError": case "OverconstrainedError":
      return "ไม่พบกล้องในเครื่อง";
    case "NotReadableError": case "AbortError":
      return "กล้องถูกใช้งานโดยแอปอื่นอยู่ กรุณาปิดแอปนั้นแล้วลองใหม่";
    default:
      return "เปิดกล้องไม่ได้ (" + ((err && err.name) || "unknown") + ")";
  }
}

async function openCam(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast(camError(null), "err"); return;
  }
  try{
    stopStream();
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:960}}, audio:false});
    }catch(e){
      if(e && (e.name === "OverconstrainedError" || e.name === "NotFoundError")){
        stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
      }else throw e;
    }
    const v = $("camVideo");
    v.srcObject = stream;
    $("camModal").classList.add("open");
    try{ await v.play(); }catch(e){}
  }catch(err){
    toast(camError(err), "err");
  }
}
function stopStream(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
}
function closeCam(){ stopStream(); $("camModal").classList.remove("open"); }

function setPhoto(dataUrl){
  photoData = dataUrl;
  $("photoPrev").src = dataUrl; $("photoPrev").style.display = "inline-block";
  $("btnPhotoClear").style.display = "inline-block";
  $("btnCam").textContent = "📷 ถ่ายใหม่";
}
function clearPhoto(){
  photoData = ""; $("photoPrev").style.display = "none"; $("photoPrev").removeAttribute("src");
  $("btnPhotoClear").style.display = "none"; $("btnCam").textContent = "📷 ถ่ายรูป";
}
function shrink(srcW, srcH, draw){
  const MAX = 900, k = Math.min(1, MAX / Math.max(srcW, srcH));
  const c = document.createElement("canvas");
  c.width = Math.round(srcW*k); c.height = Math.round(srcH*k);
  draw(c.getContext("2d"), c.width, c.height);
  return c.toDataURL("image/jpeg", 0.72);
}
$("btnCam").onclick = openCam;
$("camCancel").onclick = closeCam;
$("camFlip").onclick = () => { facing = facing === "user" ? "environment" : "user"; openCam(); };
$("camShot").onclick = () => {
  const v = $("camVideo");
  if(!v.videoWidth) return;
  setPhoto(shrink(v.videoWidth, v.videoHeight, (ctx,w,h)=>ctx.drawImage(v,0,0,w,h)));
  closeCam();
};
$("btnPhotoClear").onclick = clearPhoto;

/* ---------- ลายเซ็น ---------- */
const sig = $("sig"), sctx = sig.getContext("2d");
let drawing = false, signed = false;
function sizeSig(){
  const r = sig.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const old = signed ? sig.toDataURL() : null;
  sig.width = r.width*dpr; sig.height = r.height*dpr;
  sctx.setTransform(dpr,0,0,dpr,0,0);
  sctx.lineWidth = 2.5; sctx.lineCap = "round"; sctx.lineJoin = "round"; sctx.strokeStyle = "#111";
  if(old){ const im = new Image(); im.onload = ()=>sctx.drawImage(im,0,0,r.width,r.height); im.src = old; }
}
sizeSig(); window.addEventListener("resize", sizeSig);
const pos = e => { const r = sig.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
sig.addEventListener("pointerdown", e => {
  drawing = true; sig.setPointerCapture(e.pointerId);
  const p = pos(e); sctx.beginPath(); sctx.moveTo(p.x,p.y); sctx.lineTo(p.x+.1,p.y+.1); sctx.stroke(); signed = true;
});
sig.addEventListener("pointermove", e => { if(!drawing) return; const p = pos(e); sctx.lineTo(p.x,p.y); sctx.stroke(); });
["pointerup","pointercancel","pointerleave"].forEach(ev => sig.addEventListener(ev, ()=>drawing=false));
function clearSig(){ sctx.clearRect(0,0,sig.width,sig.height); signed = false; }
$("btnSigClear").onclick = clearSig;

/* ---------- ส่งข้อมูล + คิวสำรองกรณีเน็ตหลุด ---------- */
const getQueue = () => { try{ return JSON.parse(localStorage.getItem(LS_QUEUE) || "[]"); }catch(e){ return []; } };
const setQueue = q => { try{ localStorage.setItem(LS_QUEUE, JSON.stringify(q)); }catch(e){ toast("พื้นที่เก็บข้อมูลในเครื่องเต็ม","err"); } showPending(); };
function showPending(){
  const n = getQueue().length, el = $("pending");
  if(n){ el.style.display = "block"; el.innerHTML = `มี ${n} รายการค้างส่ง <button type="button" class="btn-sec" id="btnRetry" style="padding:6px 12px;margin-left:8px">ส่งใหม่</button>`; $("btnRetry").onclick = flushQueue; }
  else el.style.display = "none";
}
async function post(payload){
  if(!SCRIPT_URL || SCRIPT_URL.startsWith("PASTE_")) throw new Error("ยังไม่ได้ตั้งค่า SCRIPT_URL");
  const res = await fetch(SCRIPT_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload)});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || "ส่งไม่สำเร็จ");
  return j;
}
async function flushQueue(){
  let q = getQueue(), left = [];
  for(const item of q){ try{ await post(item); }catch(e){ left.push(item); } }
  setQueue(left);
  if(!left.length && q.length) toast("ส่งรายการค้างครบแล้ว","ok");
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if(!photoData){ toast("กรุณาถ่ายรูปผู้รับ","err"); return; }
  if(!signed){ toast("กรุณาเซ็นลายเซ็น","err"); return; }

  const payload = {
    office: $("office").value.trim(),
    items: readItems(),
    photo: photoData,
    signature: sig.toDataURL("image/png"),
    clientTime: new Date().toLocaleString("th-TH", {timeZone:"Asia/Bangkok"})
  };
  const btn = $("btnSubmit"); btn.disabled = true; btn.textContent = "กำลังส่ง...";
  try{
    await post(payload);
    toast("บันทึกเรียบร้อย","ok");
  }catch(err){
    if(err.message.includes("SCRIPT_URL")){ toast(err.message,"err"); btn.disabled=false; btn.textContent="ส่งข้อมูล"; return; }
    setQueue([...getQueue(), payload]);
    toast("ส่งไม่สำเร็จ เก็บไว้ในเครื่องแล้ว จะส่งซ้ำภายหลัง","err");
  }
  rememberOffice(payload.office);
  // เตรียมฟอร์มใหม่ (เลขรายการเริ่มต่อจากครั้งก่อน)
  setBase(getBase() + payload.items.length);
  // โหลดหน้าใหม่ทั้งหมด เริ่มกรอกรอบใหม่ (เลขลำดับต่อเนื่อง และจำ กฟฟ. ล่าสุดไว้)
  setTimeout(() => location.reload(), 1300);
});

showPending();
if(getQueue().length) flushQueue();
window.addEventListener("online", flushQueue);
</script>
</body>
</html>
